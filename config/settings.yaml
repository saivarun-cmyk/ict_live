# ICT Predictive Engine Configuration (1:1 Pine Script Port)

structure:
  left_bars: 5
  right_bars: 2

mode:
  confirm_on_close: false
  sweep_valid_bars: 40
  ob_search_bars: 15

zones:
  show_fvg: true
  show_ob: true
  show_liq: true
  max_zones: 4

htf_liquidity:
  show_pdhl: true
  show_pwhl: true
  show_pmhl: false
  htf_priority_only: false

equal_highs_lows:
  show_eq: true
  eq_tol_pct: 0.05

risk:
  atr_len: 14
  atr_buffer_mult: 0.15
  risk_reward: 2.0

ote:
  use_ote: true
  mode: "OTE Zone (62-79%)"  # Options: "Equilibrium (50%)", "OTE Zone (62-79%)"
  ote_min: 0.62
  ote_max: 0.79

killzones:
  use_killzone: true
  killzone1: "09:15-10:30"   # IST
  killzone2: "13:30-15:00"   # IST

htf_bias:
  use_htf_bias: false
  htf_bias_tf: "30m"
  htf_bias_strict: false
  htf_ema_len: 50

cisd:
  use_cisd: true
  show_cisd: true

fvg_quality:
  use_fvg_quality: true
  min_fvg_tier: "Standard+"   # Options: "Any", "Standard+", "Higher+", "Highest Only"
  consol_body_max_pct: 40.0
  fvg_fail_watch_bars: 3

silver_bullet:
  use_silver_bullet: true
  sb_use_kz2_too: false

ipda:
  show_ipda: true
  consol_lookback: 10
  consol_atr_mult: 1.5

telegram:
  enabled: true
  events:
    - BUY_SIGNAL
    - SELL_SIGNAL
    - SILVER_BULLET_BUY
    - SILVER_BULLET_SELL
    - TP_HIT
    - SL_HIT
    - TIME_BOXED_EXIT
